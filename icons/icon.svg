<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Finance Symbol: Wallet / Card & Ascending Bars with Coin -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="96" y="160" width="320" height="200" rx="32" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Magnetic Stripe / Header line -->
    <rect x="96" y="200" width="320" height="40" fill="#312e81" fill-opacity="0.9" />

    <!-- Bar Chart Graphic inside Card -->
    <rect x="136" y="280" width="28" height="48" rx="8" fill="#6366f1" />
    <rect x="180" y="260" width="28" height="68" rx="8" fill="#818cf8" />
    <rect x="224" y="248" width="28" height="80" rx="8" fill="url(#accentGrad)" />

    <!-- Coin / Badge -->
    <circle cx="340" cy="285" r="44" fill="url(#accentGrad)" />
    <circle cx="340" cy="285" r="36" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5" />
    <text x="340" y="302" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
